name: medigraf
description: A user-friendly mobile app for storing and visualizing personal and family health histories
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management - Latest versions
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  
  # Navigation - Latest stable
  go_router: ^17.0.0
  
  # Database - Latest Drift
  drift: ^2.29.0
  #sqlite3_flutter_libs: ^0.5.0
  sqflite: 2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Charts - Latest stable
  fl_chart: ^1.1.1
  
  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  table_calendar: ^3.2.0
  
  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.1
  
  # Authentication
  local_auth: ^3.0.0
  
  # Media & Files
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  permission_handler: ^12.0.1
  
  # Document Scanning
  cunning_document_scanner: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation - Latest versions
  build_runner: ^2.10.4
  drift_dev: ^2.29.0
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3

flutter:
  uses-material-design: true
